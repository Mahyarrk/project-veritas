# project-veritas configuration. All paths relative to the project root.
#
# One endpoint: the extraction model. Any OpenAI-compatible provider works.
# Environment overrides at call time, env wins over this file:
#   VERITAS_EXTRACT_URL / VERITAS_EXTRACT_MODEL / VERITAS_EXTRACT_KEY
# No key field exists on purpose — nothing secret lives in the repo.

extract:                                  # audit model, any OpenAI-compatible
  base_url: "http://localhost:20128/v1"   # 9router proxy
  # Measured on 3 thesis chunks (176/173/13 digits): 51.9s / 43.3s / 17.1s,
  # 3808 / 3364 / 1921 tokens, 98 statistics, 100% validated, 0 discarded.
  # (superseded: ollama/gemma4:31b — no credentials on that provider;
  #  cf/@cf/qwen/qwen3.8-27b — correct but 243s/chunk, needs 8192+ tokens)
  model: "cx/gpt-6-luna"
  max_tokens: 4096                        # big JSON tables need the headroom
  temperature: 0.0                        # accuracy-first: deterministic output

retrieval:                                # chunking only — no vector store
  chunk_size: 800                         # characters per chunk
  chunk_overlap: 150                      # overlap so split sentences stay findable

audit:
  # Justified by the tolerance sweep in validate_case.py, not asserted.
  # Papers round to 2 decimals, so exact equality is not a test.
  tolerance: 0.01

paths:
  sources: "sources/"                     # uploads land here
  extracted: "extracted_values.json"      # generated: validated statistics
  audit_report: "audit_report.json"       # generated: verdicts + provenance
