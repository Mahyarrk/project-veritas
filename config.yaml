# project-veritas configuration
# All paths relative to the project root.
#
# ENDPOINT CONFIGURATION
# Three endpoints are needed:
#   llm         — the chat model (RAG mode). Local LM Studio works well.
#   cloudflare  — the extraction/audit model via 9router (or any
#                 OpenAI-compatible endpoint). Needs an API key.
#   embeddings  — text-embedding model for retrieval.
#
# CLI override (no config editing): every endpoint accepts environment
# variables that override config.yaml at load time — the variable name is
# the config block in caps, e.g.:
#   VERITAS_LLM_URL / VERITAS_LLM_MODEL
#   VERITAS_CLOUDFLARE_URL / VERITAS_CLOUDFLARE_KEY / VERITAS_CLOUDFLARE_MODEL
#   VERITAS_EMBEDDINGS_URL / VERITAS_EMBEDDINGS_MODEL
# (block name = config.yaml key, uppercased: llm→VERITAS_LLM_*, 
#  cloudflare→VERITAS_CLOUDFLARE_*, embeddings→VERITAS_EMBEDDINGS_*)
# Precedence: environment variable > config.yaml value.
#
# GUI: the same overrides are injected by gui.py from its settings panel.

llm:
  base_url: "http://localhost:1234/v1"   # LM Studio local server
  model: "google/gemma-4-e4b"            # the auditor/chat model
  temperature: 0.0                       # accuracy-first: deterministic outputs
  max_tokens: 1024                       # per-response cap (JSON verdicts are small)

cloudflare:                              # via 9router proxy, OpenAI-compatible
  base_url: "http://localhost:20128/v1"
  api_key_env: "VERITAS_CF_KEY"          # key read from env — never stored in repo
  # extraction model: ollama/gemma4:31b (full-paper test after ling run)
  # (ling full run: extracted_ling_full.json — 234 stats, 6.5 min)
  model: "ollama/gemma4:31b"
  max_tokens: 4096

embeddings:
  base_url: "http://localhost:1234/v1"   # same server serves embeddings
  model: "text-embedding-nomic-embed-text-v1.5"

retrieval:
  chunk_size: 800          # characters per chunk
  chunk_overlap: 150       # overlap so sentences split across chunks stay findable
  top_k: 4                 # chunks retrieved per query
  # similarity floor for the deterministic refusal. Calibrated for nomic:
  # on-topic queries score 0.55-0.75, generic/meta questions ("what is
  # this about?") score 0.45-0.55, unrelated text ~0.3. Floor 0.45 keeps
  # broad questions answerable while still refusing unrelated input.
  min_score: 0.45

paper:
  formats: [txt, docx]
data:
  formats: [csv, xlsx]

paths:
  sources: "sources/"          # user drops the paper here
  store: "store.json"          # generated: chunks + embeddings
  extracted: "extracted_values.json"
  audit_report: "audit_report.json"
  chat_history: "chat_history.json"
