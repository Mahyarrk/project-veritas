[project]
name = "project-veritas"
version = "0.4.0"
description = "RAG chat + statistical auditor for scientific papers, fully local"
authors = [{ name = "Dr Mahyar Mirzazadeh, M.D." }]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pandas>=2.0",
    "scipy>=1.14",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "matplotlib>=3.11.2",
    "streamlit>=1.63.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
