[project]
name = "project-veritas"
version = "0.6.0"
description = "Deterministic statistical auditor for scientific papers: an LLM proposes published claims, code recomputes them from the raw dataset"
authors = [{ name = "Dr Mahyar Mirzazadeh, M.D." }]
license = {text = "AGPL-3.0"}
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "streamlit>=1.63.0",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
